# ============================================================
# TaskFlow 前端站点配置 —— 容器内版(deploy/docker/frontend/nginx.conf)
# 由 frontend 镜像 COPY 为 /etc/nginx/conf.d/default.conf
#
# 与裸机版(deploy/nginx.conf)的唯一区别:API 反代目标是 compose 内部
# 网络的服务名 gateway:8000,而不是 127.0.0.1:8000。
# ============================================================
server {
    listen       8080;
    server_name  _;

    # 上传大小上限(Nginx 层;后端 task-service multipart 上限 25MB,保持一致)
    client_max_body_size 25m;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------- gzip ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # ---------- SPA history 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反代到网关(内部服务名 gateway:8000,前缀原样透传)----------
    # 网关再按 lb:// 负载均衡到各注册服务;务必用 /xxx/ 带尾斜杠,
    # 避免误吞前端路由(如 /tasks)
    location /auth/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /task/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /notification/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /stats/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

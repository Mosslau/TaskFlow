# ============================================================
# TaskFlow 前端站点配置 —— 裸机(宿主机 Nginx)版
#
# 托管前端 dist(由 build.sh 输出到 deploy/artifacts/frontend-dist),
# 并把 /auth /task /notification /stats 反代到本机网关 127.0.0.1:8000。
#
# 安装方式(二选一):
#   a) 拷贝为 /etc/nginx/conf.d/taskflow.conf 后 nginx -t && nginx -s reload
#   b) Debian/Ubuntu:放入 /etc/nginx/sites-available/taskflow.conf 并
#      软链到 sites-enabled,nginx -t && systemctl reload nginx
#
# 必改项:
#   1) root 指向你机器上的实际 dist 路径(默认假设 /opt/taskflow/deploy/artifacts/frontend-dist)
#   2) 若网关不在本机,把 proxy_pass 的 127.0.0.1:8000 改为网关地址
#
# 容器版(Nginx 镜像内配置)见 deploy/docker/frontend/nginx.conf,
# 其反代目标为 compose 内部服务名 gateway:8000。
# ============================================================

server {
    listen       8080;
    server_name  _;

    # 上传大小上限(与后端 task-service multipart 上限 25MB 一致)
    client_max_body_size 25m;

    # >>> 必改:前端构建产物目录(build.sh 输出)<<<
    root   /opt/taskflow/deploy/artifacts/frontend-dist;
    index  index.html;

    # ---------- gzip ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # ---------- SPA history 路由回退(页面刷新不 404)----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- API 反代到网关(前缀原样透传,网关再 lb 到各服务)----------
    # 用带尾斜杠的 /xxx/ 前缀,避免误吞前端路由(如 /tasks、/stats 页面)
    location /auth/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /task/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /notification/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /stats/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

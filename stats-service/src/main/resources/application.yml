server:
  port: 8084

spring:
  application:
    name: stats-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/stats_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

taskflow:
  jwt:
    secret: ${JWT_SECRET:taskflow-dev-secret-please-override}
    ttl: PT2H

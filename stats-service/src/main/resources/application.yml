server:
  port: 8084

spring:
  # Nacos 配置中心（M7 落地）：共享配置 + 服务专属配置，均可选（拉不到时用本地默认）
  config:
    import:
      - optional:nacos:taskflow-common.yaml
      - optional:nacos:${spring.application.name}.yaml
  application:
    name: stats-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 本机单机开发固定注册回环 IP：避免 DHCP 换网后注册的旧 IP 失效，
        # 导致网关/Feign 按旧地址连接超时（多机或容器部署时用 NACOS_DISCOVERY_IP 覆盖为真实 IP）
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
      config:
        server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/stats_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: root
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

taskflow:
  jwt:
    secret: ${JWT_SECRET:taskflow-dev-secret-please-override}
    ttl: PT2H

# 可观测性（M7）：Actuator 端点 + Micrometer Prometheus 指标导出
management:
  endpoints:
    web:
      exposure:
        # 暴露 健康/信息/Prometheus 抓取/指标明细 四类端点
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # 直连排障时展示各组件明细（db/redis/rabbit 等）
      show-details: always
      probes:
        # 开启 /actuator/health/readiness 与 /actuator/health/liveness（K8s 探针）
        enabled: true
  metrics:
    tags:
      # 所有指标统一打 application 标签，多服务聚合时用于区分来源
      application: ${spring.application.name}

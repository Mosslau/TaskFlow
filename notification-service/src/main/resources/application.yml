server:
  port: 8083

spring:
  # Nacos 配置中心（M7 落地）：共享配置 + 服务专属配置，均可选（拉不到时用本地默认）
  config:
    import:
      - optional:nacos:taskflow-common.yaml
      - optional:nacos:${spring.application.name}.yaml
  application:
    name: notification-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 本机单机开发固定注册回环 IP：避免 DHCP 换网后注册的旧 IP 失效，
        # 导致网关/Feign 按旧地址连接超时（多机或容器部署时用 NACOS_DISCOVERY_IP 覆盖为真实 IP）
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
      config:
        server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/notification_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  # common 模块自带 spring-boot-starter-data-redis，本服务虽不直接使用 Redis，
  # 但缺省配置会连无密码的 127.0.0.1:6379，触发 Actuator redis 健康检查 DOWN；
  # 这里补齐与其他服务一致的连接参数，保证 /actuator/health 判活准确
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: root
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  mail:
    # SMTP 凭据走环境变量，不入库不入代码库（PRD 7.3.5）
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          # 隐式 SSL（465/994 端口，QQ/163 常用）：开启后走 smtps 直连，与 STARTTLS 互斥
          ssl:
            enable: ${SMTP_SSL:false}
          # SMTP 超时（默认无限会卡死消费线程；M3 联调环境本机无 SMTP，快速失败进重试）
          connectiontimeout: ${SMTP_TIMEOUT:5000}
          timeout: ${SMTP_TIMEOUT:5000}
          writetimeout: ${SMTP_TIMEOUT:5000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

taskflow:
  jwt:
    secret: ${JWT_SECRET:taskflow-dev-secret-please-override}
    ttl: PT2H
  mail:
    from: ${MAIL_FROM:taskflow@example.com}

# 可观测性（M7）：Actuator 端点 + Micrometer Prometheus 指标导出
management:
  endpoints:
    web:
      exposure:
        # 暴露 健康/信息/Prometheus 抓取/指标明细 四类端点
        include: health,info,prometheus,metrics
  endpoint:
    health:
      # 直连排障时展示各组件明细（db/redis/rabbit 等）
      show-details: always
      probes:
        # 开启 /actuator/health/readiness 与 /actuator/health/liveness（K8s 探针）
        enabled: true
  metrics:
    tags:
      # 所有指标统一打 application 标签，多服务聚合时用于区分来源
      application: ${spring.application.name}
  health:
    mail:
      # 关闭 SMTP 健康指示器：联调/生产环境本机无 SMTP（见上方 spring.mail 注释），
      # 该指示器会把整体 health 与 readiness 拖成 DOWN，导致探针误判服务不可用。
      # 邮件发送失败本身由 MailService 的落库重试链路兜底，不依赖健康检查暴露。
      enabled: false

server:
  port: 8081

spring:
  application:
    name: auth-user-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
      config:
        server-addr: 127.0.0.1:8848
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/auth_user_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: root

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

taskflow:
  jwt:
    # 开发环境密钥；生产走环境变量（PRD 7.3.5）
    secret: ${JWT_SECRET:taskflow-dev-secret-please-override}
    ttl: PT2H

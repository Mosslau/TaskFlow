<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="nar11FFmBbEHjFvmHPBbei">
<head data-page-node-id="H5zjKKpzc999cLUJPtosUV">
<meta charset="UTF-8" data-page-node-id="RsZwRPiuOVYcjbNHCAgNaZ">
<meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="LGFUFOlciQXSLJU1qOlK2X">
<title>任务管理系统 · 原型演示</title>
<style>
:root{
  --primary:#2563eb; --primary-d:#1d4ed8; --primary-l:#eff6ff;
  --success:#16a34a; --success-l:#ecfdf5;
  --warn:#f59e0b; --warn-l:#fffbeb;
  --danger:#dc2626; --danger-l:#fef2f2;
  --purple:#7c3aed; --purple-l:#f5f3ff;
  --cyan:#0891b2; --cyan-l:#ecfeff;
  --ink:#0f172a; --gray-900:#111827; --gray-700:#374151; --gray-500:#6b7280;
  --gray-400:#9ca3af; --gray-300:#d1d5db; --gray-200:#e5e7eb; --gray-100:#f3f4f6; --gray-50:#f9fafb;
  --bg:#f5f7fb; --card:#ffffff;
  --radius:14px; --radius-s:9px;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
  --shadow-l:0 10px 40px rgba(16,24,40,.16);
  --side-w:228px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--gray-900); font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit;outline:none}
button{cursor:pointer;border:none;background:none}
table{border-collapse:collapse;width:100%}
ul{list-style:none}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--side-w);flex:0 0 var(--side-w);
  background:linear-gradient(180deg,#0f172a 0%,#1e293b 100%);
  color:#cbd5e1;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;z-index:60;
}
.brand{padding:20px 18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{
  width:34px;height:34px;border-radius:10px;flex:0 0 34px;
  background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;box-shadow:0 4px 12px rgba(59,130,246,.45)
}
.brand h1{font-size:15px;color:#fff;font-weight:600;letter-spacing:.3px}
.brand span{display:block;font-size:11px;color:#64748b;font-weight:400}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-label{font-size:11px;color:#475569;padding:10px 10px 6px;letter-spacing:1px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  color:#cbd5e1;font-size:13.5px;margin-bottom:3px;transition:.16s;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:linear-gradient(90deg,rgba(37,99,235,.9),rgba(37,99,235,.55));color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.35)}
.nav-item .ic{width:18px;text-align:center;font-size:15px}
.nav-item .badge{margin-left:auto;background:#dc2626;color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;font-weight:600}
.side-foot{padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.role-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:11px 12px}
.role-card .t{font-size:10.5px;color:#94a3b8;letter-spacing:.5px;margin-bottom:7px}
.role-card select{
  width:100%;background:#1e293b;color:#fff;border:1px solid rgba(255,255,255,.14);
  border-radius:8px;padding:7px 8px;font-size:12.5px;cursor:pointer
}
.role-card .hint{font-size:10.5px;color:#64748b;margin-top:7px;line-height:1.5}

.main{flex:1;margin-left:var(--side-w);min-width:0;display:flex;flex-direction:column}
.topbar{
  height:60px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:14px;
  padding:0 22px;position:sticky;top:0;z-index:50
}
.topbar h2{font-size:17px;font-weight:600}
.topbar .sub{font-size:12px;color:var(--gray-500);font-weight:400;margin-left:8px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600}
.me{display:flex;align-items:center;gap:8px;font-size:13px}
.me small{display:block;font-size:11px;color:var(--gray-500);font-weight:400}
.view{padding:22px;display:none;animation:fadeUp .28s ease}
.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 通用组件 ============ */
.card{background:var(--card);border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{padding:15px 18px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h3{font-size:14.5px;font-weight:600}
.card-h .desc{font-size:11.5px;color:var(--gray-400);font-weight:400}
.card-b{padding:18px}
.grid{display:grid;gap:16px}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9px;font-size:12.5px;
  font-weight:500;transition:.15s;border:1px solid transparent;white-space:nowrap
}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-d);box-shadow:0 4px 12px rgba(37,99,235,.3)}
.btn-g{background:#fff;border-color:var(--gray-300);color:var(--gray-700)}
.btn-g:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-l)}
.btn-d{background:var(--danger-l);border-color:#fecaca;color:var(--danger)}
.btn-d:hover{background:#fee2e2}
.btn-s{background:var(--success-l);border-color:#bbf7d0;color:var(--success)}
.btn-s:hover{background:#dcfce7}
.btn-sm{padding:4px 9px;font-size:11.5px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.4)}
.btn:disabled:hover{box-shadow:none;background:#fff;border-color:var(--gray-300);color:var(--gray-700)}
.inp,select.inp,textarea.inp{
  width:100%;padding:8px 11px;border:1px solid var(--gray-300);border-radius:9px;background:#fff;
  transition:.15s;font-size:13px
}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
textarea.inp{resize:vertical;min-height:74px;line-height:1.6}
label.fl{display:block;font-size:12px;color:var(--gray-500);margin-bottom:5px;font-weight:500}
.fg{margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabs{display:inline-flex;background:var(--gray-100);padding:3px;border-radius:10px;gap:2px}
.tabs button{padding:6px 14px;border-radius:8px;font-size:12.5px;color:var(--gray-500);font-weight:500;transition:.15s}
.tabs button:hover{color:var(--gray-900)}
.tabs button.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:600}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:500;white-space:nowrap}
.t-P0{background:#fef2f2;color:#dc2626}
.t-P1{background:#fff7ed;color:#ea580c}
.t-P2{background:#eff6ff;color:#2563eb}
.t-P3{background:#f3f4f6;color:#6b7280}
.t-new{background:#eff6ff;color:#2563eb}
.t-doing{background:#fffbeb;color:#b45309}
.t-wait{background:#f5f3ff;color:#7c3aed}
.t-done{background:#ecfdf5;color:#16a34a}
.t-close{background:#f3f4f6;color:#6b7280}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:0 0 6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border:1px solid var(--gray-200);border-radius:20px;font-size:11.5px;background:#fff}
.mini{font-size:11.5px;color:var(--gray-400)}
.muted{color:var(--gray-500)}
.empty{text-align:center;padding:44px 20px;color:var(--gray-400)}
.empty .ic{font-size:38px;margin-bottom:10px;opacity:.5}

/* ============ 统计卡 ============ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:74px;height:74px;border-radius:50%;background:var(--c);opacity:.07}
.kpi .k-t{font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:6px}
.kpi .k-v{font-size:27px;font-weight:700;margin:6px 0 2px;letter-spacing:-.5px;color:var(--ink)}
.kpi .k-v small{font-size:13px;font-weight:500;color:var(--gray-400);margin-left:3px}
.kpi .k-f{font-size:11.5px;color:var(--gray-400)}
.kpi .up{color:var(--success);font-weight:600}
.kpi .down{color:var(--danger);font-weight:600}
.kpi .k-ic{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;background:var(--c);color:#fff;opacity:.9}

/* ============ 表格 ============ */
.tbl-wrap{overflow-x:auto}
.tbl{font-size:13px;min-width:1000px}
.tbl th{
  text-align:left;padding:11px 13px;background:var(--gray-50);color:var(--gray-500);
  font-size:11.5px;font-weight:600;letter-spacing:.4px;border-bottom:1px solid var(--gray-200);white-space:nowrap
}
.tbl td{padding:11px 13px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.tbl tbody tr{transition:.12s}
.tbl tbody tr:hover{background:var(--primary-l)}
.tbl .t-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--gray-500)}
.tbl .t-title{font-weight:500;color:var(--gray-900);max-width:290px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.tbl .t-title:hover{color:var(--primary);text-decoration:underline}
.ops{display:flex;gap:5px;flex-wrap:wrap}
.bar{height:6px;background:var(--gray-200);border-radius:6px;overflow:hidden;width:76px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.bar.warn i{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.bar.done i{background:linear-gradient(90deg,#16a34a,#4ade80)}
.who{display:flex;align-items:center;gap:6px}
.who .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600;flex:0 0 22px}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.filters .inp{width:auto;min-width:118px}
.pager{display:flex;align-items:center;gap:6px;justify-content:flex-end;padding:13px 16px;font-size:12.5px;color:var(--gray-500)}
.pager button{padding:4px 10px;border:1px solid var(--gray-300);border-radius:7px;font-size:12px}
.pager button:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.pager button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pager button:disabled{opacity:.4;cursor:not-allowed}

/* ============ 图表 ============ */
.chart-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--gray-700)}
.chart-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.donut-center{text-anchor:middle}
.hbar{margin-bottom:12px}
.hbar .h-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.hbar .h-bg{height:9px;background:var(--gray-100);border-radius:9px;overflow:hidden}
.hbar .h-fill{height:100%;border-radius:9px;transition:width .6s cubic-bezier(.4,0,.2,1)}
svg .grid-line{stroke:var(--gray-100);stroke-width:1}
svg .axis-t{fill:var(--gray-400);font-size:10.5px}
svg .dot-pt{transition:.15s}
svg .dot-pt:hover{r:5.5}

/* ============ 日程 ============ */
.cal-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--gray-100);flex-wrap:wrap}
.cal-title{font-size:16px;font-weight:600;min-width:120px}
.cal-nav{display:flex;gap:5px}
.cal-nav button{width:30px;height:30px;border:1px solid var(--gray-300);border-radius:8px;display:grid;place-items:center;font-size:13px}
.cal-nav button:hover{border-color:var(--primary);color:var(--primary)}
.cal{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-w{display:grid;grid-template-columns:repeat(7,1fr);background:var(--gray-50);border-bottom:1px solid var(--gray-200)}
.cal-w div{padding:9px 0;text-align:center;font-size:11.5px;color:var(--gray-500);font-weight:600}
.cal-d{
  min-height:104px;border-right:1px solid var(--gray-100);border-bottom:1px solid var(--gray-100);
  padding:5px 6px;cursor:pointer;transition:.13s;position:relative;overflow:hidden
}
.cal-d:hover{background:var(--primary-l)}
.cal-d.other{background:var(--gray-50);color:var(--gray-300)}
.cal-d.other .dnum{color:var(--gray-300)}
.cal-d.sel{background:var(--primary-l);box-shadow:inset 0 0 0 2px var(--primary)}
.cal-d.today .dnum{background:var(--primary);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.dnum{font-size:12.5px;font-weight:600;width:22px;height:22px;display:grid;place-items:center;color:var(--gray-700)}
.ev{font-size:10.5px;padding:2px 6px;border-radius:5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;line-height:1.5}
.ev.more{background:var(--gray-100);color:var(--gray-500);font-size:10px}
.sched-day{padding:16px 18px}
.sd-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.sd-head h4{font-size:15px}
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--gray-200)}
.tl-i{position:relative;padding:0 0 16px}
.tl-i::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
.tl-i.done::before{border-color:var(--success)}
.tl-i.over::before{border-color:var(--danger)}
.tl-time{font-size:11.5px;color:var(--gray-400);font-family:ui-monospace,Menlo,monospace}
.tl-card{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:10px;padding:10px 12px;margin-top:5px}
.tl-card:hover{border-color:var(--primary);background:#fff}

/* ============ 权限 ============ */
.perm-role{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:16px}
.rc{border:1px solid var(--gray-200);border-radius:var(--radius);padding:16px;background:#fff;position:relative;box-shadow:var(--shadow)}
.rc.hl{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.rc h4{font-size:14px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rc .cnt{font-size:24px;font-weight:700;color:var(--ink)}
.rc p{font-size:12px;color:var(--gray-500);margin-top:6px;line-height:1.6}
.rc .cur{position:absolute;right:12px;top:12px;font-size:10.5px;background:var(--primary-l);color:var(--primary);padding:2px 8px;border-radius:20px;font-weight:600}
.mx{font-size:12.5px;min-width:720px}
.mx th{padding:11px 14px;background:var(--gray-50);font-size:11.5px;color:var(--gray-500);text-align:left;font-weight:600;border-bottom:1px solid var(--gray-200)}
.mx td{padding:9px 14px;border-bottom:1px solid var(--gray-100);text-align:center}
.mx td:first-child{text-align:left;font-weight:500}
.mx th:not(:first-child){text-align:center}
.mx tbody tr:hover{background:var(--gray-50)}
.ck{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--gray-300);display:inline-grid;place-items:center;cursor:pointer;transition:.15s;color:#fff;font-size:11px;background:#fff}
.ck.on{background:var(--success);border-color:var(--success)}
.ck.lock{opacity:.35;cursor:not-allowed}
.ck:hover:not(.lock){border-color:var(--primary)}
.ck.on::after{content:"✓";font-weight:700}

/* ============ 弹窗 / 抽屉 ============ */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px;animation:fadeIn .18s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:#fff;border-radius:16px;width:100%;max-width:560px;max-height:88vh;overflow:auto;
  box-shadow:var(--shadow-l);animation:pop .22s cubic-bezier(.34,1.4,.64,1)
}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
.modal.wide{max-width:720px}
.m-h{padding:16px 20px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center}
.m-h h3{font-size:15.5px;font-weight:600}
.m-h .x{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--gray-400);font-size:17px}
.m-h .x:hover{background:var(--gray-100);color:var(--gray-900)}
.m-b{padding:20px}
.m-f{padding:14px 20px;border-top:1px solid var(--gray-100);display:flex;gap:9px;justify-content:flex-end;background:var(--gray-50);border-radius:0 0 16px 16px}
.drawer{
  position:fixed;right:0;top:0;bottom:0;width:min(560px,100%);background:#fff;z-index:101;
  box-shadow:-10px 0 40px rgba(16,24,40,.18);display:flex;flex-direction:column;animation:slideIn .26s cubic-bezier(.4,0,.2,1)
}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.d-h{padding:17px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;gap:10px}
.d-b{flex:1;overflow-y:auto;padding:20px}
.d-f{padding:14px 20px;border-top:1px solid var(--gray-100);display:flex;gap:9px;background:var(--gray-50)}
.sec-t{font-size:12px;font-weight:600;color:var(--gray-500);letter-spacing:.5px;margin:20px 0 11px;display:flex;align-items:center;gap:7px}
.sec-t::before{content:"";width:3px;height:12px;background:var(--primary);border-radius:3px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:9px 12px;font-size:13px}
.kv dt{color:var(--gray-400);font-size:12px}
.kv dd{color:var(--gray-900)}
.tl2{position:relative;padding-left:20px;margin-top:6px}
.tl2::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--gray-200)}
.tl2-i{position:relative;padding-bottom:16px;font-size:12.5px}
.tl2-i::before{content:"";position:absolute;left:-18px;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--gray-300)}
.tl2-i.hi::before{border-color:var(--primary)}
.tl2-i .mt{font-size:11px;color:var(--gray-400);font-family:ui-monospace,Menlo,monospace}
.mail-prev{background:var(--gray-50);border:1px dashed var(--gray-300);border-radius:10px;padding:13px;font-size:12.5px;line-height:1.8}
.mail-prev .mh{display:flex;gap:8px;border-bottom:1px dashed var(--gray-300);padding-bottom:7px;margin-bottom:7px;font-size:12px}
.mail-prev .mh b{color:var(--gray-500);font-weight:500;min-width:38px}
.mail-prev .mb{white-space:pre-wrap;color:var(--gray-700)}
#toast-root{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:#0f172a;color:#fff;padding:10px 18px;border-radius:11px;font-size:13px;
  box-shadow:var(--shadow-l);display:flex;align-items:center;gap:9px;animation:tin .3s cubic-bezier(.34,1.4,.64,1);max-width:88vw
}
@keyframes tin{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
.toast.ok{background:#15803d}
.toast.err{background:#b91c1c}
.toast.info{background:#1e40af}
.note{background:var(--primary-l);border:1px solid #bfdbfe;border-radius:10px;padding:11px 14px;font-size:12.5px;color:#1e40af;line-height:1.7;margin-bottom:16px}
.note b{font-weight:600}

const TODAY = new Date(2026, 8, 5);           // 模拟「今天」= 2026-09-05（周六）
const DAY = 86400000;

/* ---------- 工具函数 ---------- */
const pad = n => String(n).padStart(2, '0');
const fmtD  = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fmtDT = d => `${fmtD(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fmtT  = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const startOfWeek = d => { const x = new Date(d); const w = (x.getDay() + 6) % 7; x.setHours(0, 0, 0, 0); return addDays(x, -w); };
const startOfMonth = d => new Date(d.getFullYear(), d.getMonth(), 1);
const daysBetween = (a, b) => Math.round((b - a) / DAY);
const isSameDay = (a, b) => fmtD(a) === fmtD(b);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function ago(d) {
  const m = Math.floor((TODAY - d) / 60000);
  if (m < 60) return `${m}分钟前`;
  if (m < 1440) return `${Math.floor(m / 60)}小时前`;
  const dd = Math.floor(m / 1440);
  if (dd < 30) return `${dd}天前`;
  return `${Math.floor(dd / 30)}个月前`;
}
function relDue(d) {
  const n = daysBetween(new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate()), new Date(d.getFullYear(), d.getMonth(), d.getDate()));
  if (n === 0) return '今天到期';
  if (n === 1) return '明天到期';
  if (n === -1) return '昨天逾期';
  return n < 0 ? `逾期${-n}天` : `${n}天后`;
}

function buildTimeline(t, created, status) {
  const tl = [{ time: created, actor: t.creator, action: '创建任务', note: `提交了任务「${t.title}」` }];
  let cur = new Date(created.getTime() + (0.5 + rnd() * 8) * 3600000);

  }
  if (rnd() > .62 && status !== 'new') {

    cur = new Date(cur.getTime() + (1 + rnd() * 8) * 3600000);

    cur = new Date(cur.getTime() + (2 + rnd() * 22) * 3600000);

  if (status === 'wait' || status === 'done' || status === 'close') {

    cur = new Date(cur.getTime() + (1 + rnd() * 14) * 3600000);

}
function genTickets() {
  const arr = [];
  for (let i = 0; i < 68; i++) {
    const type = pick(TYPES);
    const title = pick(TITLES[type]);
    // 创建时间：近 90 天（近期更密集，保证周/月视图数据饱满）
    const created = new Date(addDays(TODAY, -Math.floor(Math.pow(rnd(), 2) * 88)).getTime() + Math.floor(rnd() * 86400) * 1000);
    const status = (() => {
      const r = rnd();
      const age = daysBetween(created, TODAY);
      if (age > 45) return r > .22 ? 'close' : 'done';
      if (age > 14) return r > .5 ? 'done' : (r > .28 ? 'close' : 'doing');
      if (age <= 3) return r > .3 ? 'new' : 'doing';   // 新提交的任务多数还未受理
      return r > .66 ? 'new' : (r > .44 ? 'doing' : (r > .3 ? 'wait' : 'done'));
    })();
    const prio = (() => { const r = rnd(); return r > .88 ? 'P0' : r > .62 ? 'P1' : r > .3 ? 'P2' : 'P3'; })();
    let creator = pick(USERS).id, assignee = pick(USERS.filter(u => u.role !== 'admin')).id;
    if (assignee === creator) assignee = pick(USERS).id;
    // 到期时间：创建的 1~14 天后，允许部分逾期
    const dueBase = addDays(created, 1 + Math.floor(rnd() * 13));
    const due = new Date(dueBase.getFullYear(), dueBase.getMonth(), dueBase.getDate(), 9 + Math.floor(rnd() * 10), pick([0, 15, 30, 45]));
    if (status === 'done' || status === 'close') {
      if (rnd() > .5) due.setTime(created.getTime() + (2 + rnd() * 8) * DAY);
    }
    const progress = status === 'new' ? 0 : status === 'doing' ? 20 + Math.floor(rnd() * 55)
      : status === 'wait' ? 80 + Math.floor(rnd() * 15) : 100;
    const t = {
      id: 'TSK-' + (SEQ++), title, desc: pick(DESCS), type,
      status, priority: prio, creator, assignee,
      createdAt: created, dueAt: due,
      updatedAt: new Date(created.getTime() + (1 + rnd() * 40) * 3600000),

    if (status === 'done' || status === 'close') {
      // 约 28% 为逾期完成，其余按时完成
      const late = rnd() > .72;

      d.setHours(9 + Math.floor(rnd() * 10), pick([0, 15, 30, 45]));

  arr.sort((a, b) => b.createdAt - a.createdAt);

}

  if (!isDone(t)) return null;
  return (t.updatedAt - t.createdAt) / 3600000;
}
function onTime(t) {
  if (!isDone(t)) return null;
  return t.updatedAt <= t.dueAt;
}

/* ---------- 图表 ---------- */
function lineChart(labels, series, w = 680, h = 250) {
  const P = { t: 16, r: 14, b: 30, l: 34 };
  const iw = w - P.l - P.r, ih = h - P.t - P.b;
  const max = Math.max(4, ...series.flatMap(s => s.data));
  const step = iw / Math.max(1, labels.length - 1);
  const X = i => P.l + i * step;
  const Y = v => P.t + ih - (v / max) * ih;
  let g = '';
  for (let i = 0; i <= 4; i++) {
    const y = P.t + (ih / 4) * i;
    g += `<line class="grid-line" x1="${P.l}" y1="${y}" x2="${w - P.r}" y2="${y}"/>`;
    g += `<text class="axis-t" x="${P.l - 7}" y="${y + 3.5}" text-anchor="end">${Math.round(max - (max / 4) * i)}</text>`;
  }
  const every = Math.ceil(labels.length / 9);
  labels.forEach((lb, i) => {
    if (i % every === 0 || i === labels.length - 1)
      g += `<text class="axis-t" x="${X(i)}" y="${h - 9}" text-anchor="middle">${lb}</text>`;
  });
  series.forEach(s => {
    const pts = s.data.map((v, i) => `${X(i)},${Y(v)}`).join(' ');
    g += `<polygon points="${P.l},${P.t + ih} ${pts} ${X(s.data.length - 1)},${P.t + ih}" fill="${s.color}" opacity=".07"/>`;
    g += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.data.forEach((v, i) => {
      if (labels.length <= 40)
        g += `<circle class="dot-pt" cx="${X(i)}" cy="${Y(v)}" r="3.2" fill="#fff" stroke="${s.color}" stroke-width="2"><title>${labels[i]} · ${s.name}：${v}</title></circle>`;
    });
  });
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">
    <defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".22"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs>
    ${g}</svg>`;
}
function donut(items, total) {
  const size = 180, r = 66, cx = size / 2, cy = size / 2, C = 2 * Math.PI * r;
  let off = 0, arcs = '';
  items.forEach(it => {
    if (!it.value) return;
    const len = (it.value / (total || 1)) * C;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="26"
      stroke-dasharray="${len - 2} ${C - len + 2}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"
      stroke-linecap="butt"><title>${it.label}：${it.value}（${Math.round(it.value / (total || 1) * 100)}%）</title></circle>`;
    off += len;
  });

      <i style="background:${it.color}"></i><span style="min-width:52px">${it.label}</span>
      <b style="min-width:26px;text-align:right">${it.value}</b>
      <span class="mini">${total ? Math.round(it.value / total * 100) : 0}%</span></div>`).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:0 0 ${size}px">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f3f4f6" stroke-width="26"/>
      ${arcs}
      <text class="donut-center" x="${cx}" y="${cy - 3}" font-size="26" font-weight="700" fill="#0f172a">${total}</text>
      <text class="donut-center" x="${cx}" y="${cy + 17}" font-size="11" fill="#9ca3af">任务总数</text>

    <div style="display:flex;flex-direction:column;gap:9px;font-size:13px">${legend}</div>`;
}

    { t: '任务总数', v: list.length, u: '项', f: `已完成 ${done.length} · 进行中 ${open.length}`, c: '#2563eb', ic: '📋' },
    { t: '待办 / 进行中', v: open.length, u: '项', f: `待办 ${list.filter(t => t.status === 'new').length} · 进行中 ${list.filter(t => t.status === 'doing').length}`, c: '#f59e0b', ic: '⏳' },
    { t: '已逾期', v: overdue.length, u: '项', f: overdue.length ? `<span class="down">需立即跟进</span>` : '暂无逾期任务', c: '#dc2626', ic: '⚠️' },
    { t: '紧急任务 (P0)', v: p0.length, u: '项', f: `占比 ${list.length ? Math.round(p0.length / list.length * 100) : 0}%`, c: '#7c3aed', ic: '🔥' },
    { t: '平均完成时长', v: avgH ? avgH.toFixed(1) : '0', u: '小时', f: `基于 ${done.length} 项已完成任务`, c: '#0891b2', ic: '⏱' },
    { t: '按时完成率', v: rate.toFixed(0), u: '%', f: `${ot} / ${done.length} 项按时完成`, c: '#16a34a', ic: '🎯' }
  ];
  $('#kpis').innerHTML = K.map(k => `<div class="kpi" style="--c:${k.c}">
      <div class="k-ic">${k.ic}</div>
      <div class="k-t">${k.t}</div>
      <div class="k-v">${k.v}<small>${k.u}</small></div>
      <div class="k-f">${k.f}</div></div>`).join('');

  // 趋势：按天（区间<=62天）否则按周
  const span = daysBetween(b.s, b.e);
  let labels = [], created = [], closed = [];
  if (span <= 70) {
    for (let d = new Date(b.s); d < b.e && d <= TODAY; d = addDays(d, 1)) {
      const k = fmtD(d);
      labels.push(`${d.getMonth() + 1}/${d.getDate()}`);
      created.push(list.filter(t => fmtD(t.createdAt) === k).length);
      closed.push(done.filter(t => isDone(t) && fmtD(t.updatedAt) === k).length);
    }
  } else {
    for (let d = new Date(b.s); d < b.e && d <= TODAY; d = addDays(d, 7)) {
      const e = addDays(d, 7), k = fmtD(d);
      labels.push(`${d.getMonth() + 1}/${d.getDate()}`);
      created.push(list.filter(t => t.createdAt >= d && t.createdAt < e).length);
      closed.push(done.filter(t => t.updatedAt >= d && t.updatedAt < e).length);
    }
  }
  $('#chart-trend').innerHTML = lineChart(labels, [
    { name: '新建任务', color: '#2563eb', data: created },
    { name: '完成任务', color: '#16a34a', data: closed }
  ]) + `<div class="chart-legend"><span><i style="background:#2563eb"></i>新建任务 ${created.reduce((a, c) => a + c, 0)}</span>
        <span><i style="background:#16a34a"></i>完成任务 ${closed.reduce((a, c) => a + c, 0)}</span></div>`;

  const stItems = Object.keys(STATUS).map(k => ({ label: STATUS[k].name, value: list.filter(t => t.status === k).length, color: STATUS[k].color }));
  $('#chart-status').innerHTML = donut(stItems, list.length);

  const pItems = Object.keys(PRIO).map(k => ({ label: PRIO[k].name, value: list.filter(t => t.priority === k).length, color: PRIO[k].color }));
  $('#chart-prio').innerHTML = hbar(pItems, Math.max(...pItems.map(i => i.value), 1));

  const loads = USERS.filter(u => u.role !== 'admin').map(u => ({
    label: `${u.name}<span class="mini"> · ${u.dept}</span>`,
    value: list.filter(t => t.assignee === u.id && OPEN_STATUS.includes(t.status)).length,
    color: u.color
  })).sort((a, b) => b.value - a.value);
  $('#chart-load').innerHTML = hbar(loads, Math.max(...loads.map(i => i.value), 1));
}

/* ---------- 任务列表 ---------- */
const FILTER = { kw: '', status: '', prio: '', type: '', assignee: '', scope: 'all' };
let PAGE = 1, PAGE_SIZE = 10;
function filtered() {
  return TICKETS.filter(t => {
    if (!visible(t)) return false;
    const kw = FILTER.kw.trim().toLowerCase();
    if (kw && !(t.title + t.id + t.desc + U(t.assignee).name).toLowerCase().includes(kw)) return false;
    if (FILTER.status && t.status !== FILTER.status) return false;
    if (FILTER.prio && t.priority !== FILTER.prio) return false;
    if (FILTER.type && t.type !== FILTER.type) return false;
    if (FILTER.assignee && t.assignee !== FILTER.assignee) return false;
    if (FILTER.scope === 'mine_assigned' && t.assignee !== CURRENT) return false;
    if (FILTER.scope === 'mine_created' && t.creator !== CURRENT) return false;
    if (FILTER.scope === 'overdue' && !isOverdue(t)) return false;
    return true;
  });
}
function renderTickets() {
  const list = filtered();
  const total = list.length;
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  if (PAGE > pages) PAGE = pages;
  const page = list.slice((PAGE - 1) * PAGE_SIZE, PAGE * PAGE_SIZE);
  $('#tk-count').textContent = `共 ${total} 条（当前可见 ${TICKETS.filter(visible).length} / 全部 ${TICKETS.length}）`;
  $('#nav-td-badge').textContent = TICKETS.filter(t => visible(t) && OPEN_STATUS.includes(t.status)).length;

  const canEdit = t => can('editOwn', t);
  const canDel = t => can('deleteOwn', t);
  const canTr = t => can('transferOwn', t) || can('transferAssigned', t);
  const canPrio = t => can('prioOwn', t);
  const canDue = t => can('dueOwn', t);
  const canUpd = t => can('updateAssigned', t) || canEdit(t);

  let html = `<thead><tr>
    <th>编号</th><th>标题</th><th>类型</th><th>优先级</th><th>状态</th><th>进度</th>
    <th>创建人</th><th>负责人</th><th>到期时间</th><th>更新</th><th style="min-width:210px">操作</th></tr></thead><tbody>`;
  if (!page.length) {
    html += `<tr><td colspan="11"><div class="empty"><div class="ic">🗂</div>没有符合条件的任务</div></td></tr>`;
  }
  page.forEach(t => {
    const ov = isOverdue(t);
    const dueCls = ov ? 'color:var(--danger);font-weight:600' : (isDone(t) ? 'color:var(--gray-400)' : '');
    const barCls = t.progress >= 100 ? 'done' : (ov ? 'warn' : '');
    html += `<tr>
      <td class="t-id">${t.id}</td>
      <td><div class="t-title" onclick="openDetail('${t.id}')" title="${esc(t.title)}">${esc(t.title)}</div>
          <div class="mini">${t.source} · ${t.type}</div></td>
      <td><span class="pill">${t.type}</span></td>
      <td><span class="tag ${PRIO[t.priority].cls}">${PRIO[t.priority].name}</span></td>
      <td><span class="tag ${STATUS[t.status].cls}">${STATUS[t.status].name}</span></td>
      <td><div class="bar ${barCls}"><i style="width:${t.progress}%"></i></div><span class="mini">${t.progress}%</span></td>
      <td><div class="who"><div class="av" style="background:${U(t.creator).color}">${t.creator && U(t.creator).name[0]}</div><span>${U(t.creator).name}</span></div></td>
      <td><div class="who"><div class="av" style="background:${U(t.assignee).color}">${U(t.assignee).name[0]}</div><span>${U(t.assignee).name}</span></div></td>
      <td style="${dueCls}">${fmtDT(t.dueAt)}<div class="mini" style="${dueCls}">${isDone(t) ? '已归档' : relDue(t.dueAt)}</div></td>
      <td class="mini">${ago(t.updatedAt)}</td>
      <td><div class="ops">
        <button class="btn btn-g btn-sm" onclick="openDetail('${t.id}')">详情</button>
        <button class="btn btn-g btn-sm" onclick="openEdit('${t.id}')" ${canEdit(t) ? '' : 'disabled title="' + denyReason('editOwn', t) + '"'}>编辑</button>
        <button class="btn btn-g btn-sm" onclick="openTransfer('${t.id}')" ${canTr(t) ? '' : 'disabled title="' + (can('transferOwn', t) ? denyReason('transferOwn', t) : denyReason('transferAssigned', t)) + '"'}>转派</button>
        <button class="btn btn-g btn-sm" onclick="quickPrio('${t.id}')" ${canPrio(t) ? '' : 'disabled title="' + denyReason('prioOwn', t) + '"'}>优先级</button>
        <button class="btn btn-g btn-sm" onclick="quickDue('${t.id}')" ${canDue(t) ? '' : 'disabled title="' + denyReason('dueOwn', t) + '"'}>到期</button>
        <button class="btn btn-d btn-sm" onclick="delTicket('${t.id}')" ${canDel(t) ? '' : 'disabled title="' + denyReason('deleteOwn', t) + '"'}>删除</button>
      </div></td></tr>`;
  });
  html += '</tbody>';
  $('#ticket-tbl').innerHTML = html;

  let pg = `<span style="margin-right:auto">第 ${(PAGE - 1) * PAGE_SIZE + 1}-${Math.min(PAGE * PAGE_SIZE, total)} 条 / 共 ${total} 条</span>
    <button ${PAGE === 1 ? 'disabled' : ''} onclick="goPage(${PAGE - 1})">上一页</button>`;
  const shown = [];
  for (let i = 1; i <= pages; i++) {
    if (i === 1 || i === pages || Math.abs(i - PAGE) <= 1) shown.push(i);
    else if (shown[shown.length - 1] !== '...') shown.push('...');
  }
  shown.forEach(i => pg += i === '...' ? '<span>…</span>' :
    `<button class="${i === PAGE ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`);
  pg += `<button ${PAGE === pages ? 'disabled' : ''} onclick="goPage(${PAGE + 1})">下一页</button>`;
  $('#pager').innerHTML = pg;

  const role = myRole();
  const tips = {
    admin: '当前为<b>系统管理员</b>：拥有最高权限，可查看与操作全部任务（创建 / 编辑 / 删除 / 转派 / 调整优先级与到期时间 / 导出），并管理用户、角色与权限矩阵。',
    taskAdmin: '当前为<b>任务管理员</b>：可查看全部任务；对<b>自己创建</b>的任务可增删改、转派、调整优先级与到期时间；对<b>指派给自己</b>的任务可更新进度与再次转派；不可配置系统与权限。',
    user: '当前为<b>普通用户</b>：仅可查看、更新进度、转派<b>指派给自己</b>的任务（转派会发送邮件通知）；不可创建任务，也看不到与自己无关的任务。'
  };
  $('#tk-note').innerHTML = `🔐 ${tips[role]}`;
}
const goPage = p => { PAGE = p; renderTickets(); window.scrollTo({ top: 0, behavior: 'smooth' }); };

/* ---------- 日程 ---------- */
let CAL_CUR = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
let CAL_SEL = new Date(TODAY);
function calEventsOf(day) {
  return TICKETS.filter(t => {
    if (!visible(t)) return false;
    if ($('#cal-only-mine') && $('#cal-only-mine').checked && t.assignee !== CURRENT) return false;
    return isSameDay(t.dueAt, day);
  }).sort((a, b) => a.dueAt - b.dueAt);
}
function renderCalendar() {
  const y = CAL_CUR.getFullYear(), m = CAL_CUR.getMonth();
  $('#cal-title').textContent = `${y} 年 ${m + 1} 月`;
  const first = startOfMonth(CAL_CUR);
  const start = startOfWeek(first);
  let html = '', monthCount = 0;
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    const evs = calEventsOf(d);
    if (d.getMonth() === m) monthCount += evs.length;
    const cls = ['cal-d'];
    if (!isSameDay(d, first) && d.getMonth() !== m) cls.push('other');
    if (isSameDay(d, TODAY)) cls.push('today');
    if (isSameDay(d, CAL_SEL)) cls.push('sel');
    let inner = `<div class="dnum">${d.getDate()}</div>`;
    evs.slice(0, 3).forEach(t => {
      const c = isDone(t) ? '#16a34a' : (isOverdue(t) ? '#dc2626' : U(t.assignee).color);
      inner += `<div class="ev" style="background:${c}" title="${fmtT(t.dueAt)} ${esc(t.title)}">${fmtT(t.dueAt)} ${esc(t.title)}</div>`;
    });
    if (evs.length > 3) inner += `<div class="ev more">+${evs.length - 3} 个任务</div>`;
    html += `<div class="${cls.join(' ')}" onclick="selectDay('${fmtD(d)}')">${inner}</div>`;
  }
  $('#cal-grid').innerHTML = html;
  $('#cal-stat').textContent = `本月 ${monthCount} 个任务到期`;
  renderSched();
}
function selectDay(ds) {
  CAL_SEL = parseD(ds);
  if (CAL_SEL.getMonth() !== CAL_CUR.getMonth() || CAL_SEL.getFullYear() !== CAL_CUR.getFullYear()) CAL_CUR = startOfMonth(CAL_SEL);
  renderCalendar();
}
function renderSched() {
  const evs = calEventsOf(CAL_SEL);
  const wd = ['日', '一', '二', '三', '四', '五', '六'][CAL_SEL.getDay()];
  $('#sched-title').textContent = `${CAL_SEL.getMonth() + 1}月${CAL_SEL.getDate()}日 · 周${wd}`;
  if (!evs.length) {
    $('#sched-panel').innerHTML = '<div class="empty"><div class="ic">🍃</div>这一天没有到期的任务</div>';
    return;
  }
  let html = `<div class="sd-head"><h4>${evs.length} 个任务</h4>
      <span class="mini">逾期 ${evs.filter(isOverdue).length} · 已完成 ${evs.filter(isDone).length}</span></div><div class="tl">`;
  evs.forEach(t => {
    const cls = isDone(t) ? 'done' : (isOverdue(t) ? 'over' : '');
    html += `<div class="tl-i ${cls}">
      <div class="tl-time">${fmtT(t.dueAt)} ${isOverdue(t) ? '<span style="color:var(--danger)">· 已逾期</span>' : ''}</div>
      <div class="tl-card" onclick="openDetail('${t.id}')" style="cursor:pointer">
        <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
          <span class="tag ${PRIO[t.priority].cls}">${PRIO[t.priority].name}</span>
          <span class="tag ${STATUS[t.status].cls}">${STATUS[t.status].name}</span>
          <b style="font-size:13px">${esc(t.title)}</b>
        </div>
        <div class="mini" style="margin-top:5px">${t.id} · ${t.type} · 负责人 ${U(t.assignee).name} · 进度 ${t.progress}%</div>
        <div class="ops" style="margin-top:8px">
          <button class="btn btn-g btn-sm" onclick="event.stopPropagation();quickDue('${t.id}')" ${can('dueOwn', t) ? '' : 'disabled'}>改期</button>
          <button class="btn btn-g btn-sm" onclick="event.stopPropagation();quickPrio('${t.id}')" ${can('prioOwn', t) ? '' : 'disabled'}>优先级</button>
          <button class="btn btn-g btn-sm" onclick="event.stopPropagation();openTransfer('${t.id}')" ${(can('transferOwn', t) || can('transferAssigned', t)) ? '' : 'disabled'}>转派</button>
        </div>
      </div></div>`;
  });
  $('#sched-panel').innerHTML = html + '</div>';
}

/* ---------- 权限管理 ---------- */
function renderPermission() {
  const role = myRole();
  $('#role-cards').innerHTML = Object.values(ROLES).map(r => {
    const n = USERS.filter(u => u.role === r.key).length;
    const perms = Object.values(PERM[r.key]).filter(Boolean).length;
    const d = {
      admin: '系统最高权限：可查看与操作全部任务，管理用户、角色与权限矩阵。',
      taskAdmin: '可查看全部任务；对自己创建的任务可增删改、转派与调整优先级/到期；对指派给自己的任务可更新进度与再转派。',
      user: '仅可查看、更新、转派「指派给自己」的任务，不可创建任务。'
    }[r.key];
    return `<div class="rc ${r.key === role ? 'hl' : ''}">
      ${r.key === role ? '<span class="cur">当前身份</span>' : ''}
      <h4><span class="dot" style="background:${r.color};width:9px;height:9px"></span>${r.name}</h4>
      <div class="cnt">${n}<span style="font-size:12px;color:var(--gray-400);font-weight:400"> 人</span></div>
      <p>${d}</p>
      <p class="mini">已开启 ${perms} / ${PERM_DEFS.length} 项权限</p>
      <button class="btn ${r.key === role ? 'btn-g' : 'btn-p'} btn-sm" style="margin-top:10px" onclick="switchToRole('${r.key}')">${r.key === role ? '已是该身份' : '切换为此身份'}</button>
    </div>`;
  }).join('');

  let h = `<thead><tr><th style="min-width:190px">权限项</th>${Object.values(ROLES).map(r => `<th>${r.name}</th>`).join('')}</tr></thead><tbody>`;
  let lastGroup = '';
  PERM_DEFS.forEach(p => {
    if (p.group !== lastGroup) {
      h += `<tr><td colspan="4" style="background:var(--gray-50);font-size:11px;color:var(--gray-500);font-weight:600;padding:7px 14px">${p.group}</td></tr>`;
      lastGroup = p.group;
    }
    h += `<tr><td>${p.name}<div class="mini" style="font-weight:400">${p.key}</div></td>`;
    Object.keys(ROLES).forEach(rk => {
      const locked = rk === 'admin';
      const on = PERM[rk][p.key];
      const canSet = PERM[role].setPerm;
      h += `<td><span class="ck ${on ? 'on' : ''} ${locked || !canSet ? 'lock' : ''}"
        ${locked || !canSet ? `title="${locked ? '管理员权限不可关闭' : '需要「配置权限矩阵」权限'}"` : `onclick="togglePerm('${rk}','${p.key}')" title="点击切换"`}></span></td>`;
    });
    h += '</tr>';
  });
  $('#perm-tbl').innerHTML = h + '</tbody>';

  let u = `<thead><tr><th>用户</th><th>部门</th><th>邮箱</th><th>角色</th><th>进行中</th><th>操作</th></tr></thead><tbody>`;
  USERS.forEach(x => {
    const doing = TICKETS.filter(t => t.assignee === x.id && OPEN_STATUS.includes(t.status)).length;
    const canSet = PERM[role].manageUser;
    u += `<tr>
      <td><div class="who"><div class="av" style="background:${x.color}">${x.name[0]}</div>
        <div>${x.name}${x.id === CURRENT ? ' <span class="pill" style="padding:1px 7px;font-size:10px">我</span>' : ''}</div></div></td>
      <td class="muted">${x.dept}</td>
      <td class="mini">${x.email}</td>
      <td><select class="inp" style="padding:4px 8px;font-size:12px" ${canSet ? '' : 'disabled'} onchange="setUserRole('${x.id}',this.value)">
        ${Object.values(ROLES).map(r => `<option value="${r.key}" ${x.role === r.key ? 'selected' : ''}>${r.name}</option>`).join('')}
      </select></td>
      <td><b>${doing}</b></td>
      <td><button class="btn btn-g btn-sm" ${canSet ? '' : 'disabled'} onclick="loginAs('${x.id}')">以此身份登录</button></td>
    </tr>`;
  });
  $('#user-tbl').innerHTML = u + '</tbody>';
}
function togglePerm(rk, key) {
  if (rk === 'admin') return toast('管理员权限不可关闭', 'err');
  if (!PERM[myRole()].setPerm) return toast('当前角色无权限配置权限矩阵', 'err');
  PERM[rk][key] = PERM[rk][key] ? 0 : 1;
  renderAll();
  toast(`${ROLES[rk].name}「${PERM_DEFS.find(p => p.key === key).name}」已${PERM[rk][key] ? '开启' : '关闭'}`, PERM[rk][key] ? 'ok' : '');
}
function setUserRole(uid, rk) {
  if (!PERM[myRole()].manageUser) return toast('无用户管理权限', 'err');
  U(uid).role = rk;
  renderPermission();
  toast(`${U(uid).name} 的角色已改为「${ROLES[rk].name}」`, 'ok');
  if (uid === CURRENT) renderAll();
}
function switchToRole(rk) {
  const u = USERS.find(x => x.role === rk) || USERS[0];
  loginAs(u.id, true);
}
function loginAs(uid, silent) {
  CURRENT = uid;
  $('#role-select').value = uid;
  PAGE = 1;
  renderAll();
  if (!silent) toast(`已切换到「${U(uid).name}」（${ROLES[U(uid).role].name}）`, 'ok');
  else toast(`已切换身份：${ROLES[U(uid).role].name} · ${U(uid).name}`, 'ok');
}
</script>
<script>
/* =====================================================================
 *  交互层：弹窗 / 抽屉 / 转派邮件 / 初始化
 * =====================================================================*/
function closeModal() { $('#modal-root').innerHTML = ''; }
function modal(title, body, footer, wide) {
  $('#modal-root').innerHTML = `<div class="mask" style="z-index:120" onclick="if(event.target===this)closeModal()">
    <div class="modal ${wide ? 'wide' : ''}">
      <div class="m-h"><h3>${title}</h3><button class="x" onclick="closeModal()">×</button></div>
      <div class="m-b">${body}</div>
      <div class="m-f">${footer || '<button class="btn btn-g" onclick="closeModal()">取消</button>'}</div>
    </div></div>`;
}

/* ---------- 新建 / 编辑任务 ---------- */
function ticketForm(t) {
  const isNew = !t;
  const d = t || { title: '', desc: '', type: TYPES[0], priority: 'P2', status: 'new', assignee: USERS.find(u => u.role !== 'admin').id, dueAt: addDays(TODAY, 3), progress: 0 };
  const dueD = fmtD(d.dueAt), dueT = fmtT(d.dueAt);
  return `
    <div class="fg"><label class="fl">任务标题 *</label><input class="inp" id="f-title" value="${esc(d.title)}" placeholder="简要描述要做什么"></div>
    <div class="row2">
      <div class="fg"><label class="fl">任务类型</label><select class="inp" id="f-type">${TYPES.map(x => `<option ${x === d.type ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="fg"><label class="fl">优先级</label><select class="inp" id="f-prio">${Object.keys(PRIO).map(k => `<option value="${k}" ${k === d.priority ? 'selected' : ''}>${PRIO[k].name}</option>`).join('')}</select></div>
    </div>
    <div class="row2">
      <div class="fg"><label class="fl">负责人</label><select class="inp" id="f-assignee">${USERS.filter(u => u.role !== 'admin').map(u => `<option value="${u.id}" ${u.id === d.assignee ? 'selected' : ''}>${u.name}（${u.dept}）</option>`).join('')}</select></div>
      <div class="fg"><label class="fl">状态</label><select class="inp" id="f-status">${Object.keys(STATUS).map(k => `<option value="${k}" ${k === d.status ? 'selected' : ''}>${STATUS[k].name}</option>`).join('')}</select></div>

/* ---------- 导出 ---------- */
function exportCSV() {
  if (!PERM[myRole()].exportData) { toast('当前角色无导出权限', 'err'); return; }
  const rows = [['编号', '标题', '类型', '优先级', '状态', '进度', '创建人', '负责人', '创建时间', '到期时间']]
    .concat(filtered().map(t => [t.id, t.title, t.type, PRIO[t.priority].name, STATUS[t.status].name, t.progress + '%', U(t.creator).name, U(t.assignee).name, fmtDT(t.createdAt), fmtDT(t.dueAt)]));
  const csv = '\ufeff' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `任务列表_${fmtD(TODAY)}.csv`;
  a.click();
  toast(`已导出 ${rows.length - 1} 条任务`, 'ok');
}

  $('#f-status').innerHTML += Object.keys(STATUS).map(k => `<option value="${k}">${STATUS[k].name}</option>`).join('');
  $('#f-prio').innerHTML += Object.keys(PRIO).map(k => `<option value="${k}">${PRIO[k].name}</option>`).join('');
  $('#f-type').innerHTML += TYPES.map(x => `<option>${x}</option>`).join('');
  $('#f-assignee').innerHTML += USERS.map(u => `<option value="${u.id}">${u.name}</option>`).join('');

  $$('.nav-item').forEach(b => b.onclick = () => switchView(b.dataset.view));
  $$('#range-tabs button').forEach(b => b.onclick = () => {
    $$('#range-tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); RANGE = b.dataset.range;
    $('#custom-range').style.display = RANGE === 'custom' ? 'flex' : 'none';
    if (RANGE === 'custom' && !$('#ds').value) { $('#ds').value = CUSTOM.s; $('#de').value = CUSTOM.e; }
    renderOverview();
  });
  $('#btn-apply-range').onclick = () => {
    if (!$('#ds').value || !$('#de').value) return toast('请选择起止日期', 'err');
    if ($('#ds').value > $('#de').value) return toast('开始日期不能晚于结束日期', 'err');
    CUSTOM = { s: $('#ds').value, e: $('#de').value }; renderOverview(); toast('统计区间已更新', 'ok');
  };
  ['kw', 'status', 'prio', 'type', 'assignee', 'scope'].forEach(k => {
    const el = $('#f-' + k); if (!el) return;
    el.oninput = el.onchange = () => { FILTER[k] = el.value; PAGE = 1; renderTickets(); };
  });
  $('#btn-reset').onclick = () => {
    Object.keys(FILTER).forEach(k => FILTER[k] = k === 'scope' ? 'all' : '');
    ['kw', 'status', 'prio', 'type', 'assignee', 'scope'].forEach(k => { const e = $('#f-' + k); if (e) e.value = FILTER[k]; });
    PAGE = 1; renderTickets();
  };
  $('#btn-new-ticket').onclick = openNew;
  $('#btn-export').onclick = exportCSV;
  $('#cal-prev').onclick = () => { CAL_CUR = new Date(CAL_CUR.getFullYear(), CAL_CUR.getMonth() - 1, 1); renderCalendar(); };
  $('#cal-next').onclick = () => { CAL_CUR = new Date(CAL_CUR.getFullYear(), CAL_CUR.getMonth() + 1, 1); renderCalendar(); };
  $('#cal-today').onclick = () => { CAL_CUR = startOfMonth(TODAY); CAL_SEL = new Date(TODAY); renderCalendar(); };
  $('#cal-only-mine').onchange = renderCalendar;
  $('#btn-reset-perm').onclick = () => {
    if (!PERM[myRole()].setPerm) return toast('无权限配置权限矩阵', 'err');
    PERM = JSON.parse(JSON.stringify(DEFAULT_PERM)); renderAll(); toast('权限矩阵已恢复默认', 'ok');
  };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeDrawer(); } });
  renderAll();
}
init();
</script>
</body>
</html>

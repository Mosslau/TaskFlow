server:
  port: 8000 # Nacos 3.x 控制台占用 8080，网关用 8000

spring:
  # Nacos 配置中心（M7 落地）：共享配置 + 服务专属配置，均可选（拉不到时用本地默认）
  config:
    import:
      - optional:nacos:taskflow-common.yaml
      - optional:nacos:${spring.application.name}.yaml
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 本机单机开发固定注册回环 IP：避免 DHCP 换网后注册的旧 IP 失效，
        # 导致网关/Feign 按旧地址连接超时（多机或容器部署时用 NACOS_DISCOVERY_IP 覆盖为真实 IP）
        ip: ${NACOS_DISCOVERY_IP:127.0.0.1}
      config:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        # 模块前缀路由（接口设计文档 1.1）
        - id: auth-user-service
          uri: lb://auth-user-service
          predicates:
            - Path=/auth/api/v1/**
        - id: task-service
          uri: lb://task-service
          predicates:
            - Path=/task/api/v1/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notification/api/v1/**
        - id: stats-service
          uri: lb://stats-service
          predicates:
            - Path=/stats/api/v1/**
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Methods, RETAIN_UNIQUE
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: root

taskflow:
  jwt:
    # 与各服务同一密钥（生产走环境变量 JWT_SECRET）
    secret: ${JWT_SECRET:taskflow-dev-secret-please-override}
    ttl: PT2H
# 注意：taskflow.ratelimit.*（enabled / user-per-minute / ip-per-minute）不在本文件定义，
# 由 Nacos 配置中心 dataId=taskflow-common.yaml 下发（网关级 Redis 限流，PRD 7.3 / M6.4）。
# 原因：spring.config.import 导入的配置优先级 **低于** 本文件，本地一旦定义同名键就会把
# Nacos 的值遮蔽掉，导致配置中心改了不生效（2026-09-11 实测踩坑，见 docs/可观测性与配置中心.md）。
# RateLimitFilter 内的 @Value 默认值为 true / 300 / 600，Nacos 不可用时自动兜底。

# 可观测性（M7）：Actuator 端点 + Micrometer Prometheus 指标导出
management:
  endpoints:
    web:
      exposure:
        # 暴露 健康/信息/Prometheus 抓取/指标明细 四类端点
        include: health,info,prometheus,metrics,refresh
  endpoint:
    health:
      # 直连排障时展示各组件明细（db/redis/rabbit 等）
      show-details: always
      probes:
        # 开启 /actuator/health/readiness 与 /actuator/health/liveness（K8s 探针）
        enabled: true
  metrics:
    tags:
      # 所有指标统一打 application 标签，多服务聚合时用于区分来源
      application: ${spring.application.name}
